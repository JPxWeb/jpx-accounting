name: CI

on:
  pull_request:
    branches: [main]
    # `labeled` is included so adding the `run-e2e` label retriggers CI and the gated E2E job actually fires.
    # Removing a label also fires `unlabeled`, but the E2E job's `if:` re-evaluates and simply skips, so no extra cost.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.29.2"

jobs:
  check:
    name: Typecheck & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Lint + format before typecheck — fast feedback; aligns with root eslint.config.mjs (Next flat + typescript-eslint).
      - name: Lint
        run: pnpm lint

      # Mirrors root `pnpm check` — a missing sv/en key must fail CI, not first surface at runtime.
      - name: Check i18n parity
        run: corepack pnpm check:i18n

      - name: Prettier check
        run: pnpm format:check

      - name: Typecheck all packages
        run: pnpm typecheck

      # Matches root `pnpm check` — tests/ has its own tsconfig (see tests/tsconfig.json).
      - name: Typecheck tests directory
        run: pnpm typecheck:tests

      - name: Run unit tests
        run: pnpm test:unit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all
        run: pnpm build

  # Decide whether PG15 compatibility runs (persistence/migration touch or manual dispatch).
  # PG17 is always required; see integration-postgres below.
  postgres-matrix:
    name: Postgres matrix plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Plan PG15/PG17 matrix
        id: plan
        shell: bash
        run: |
          run_pg15=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            run_pg15=true
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            if git diff --name-only "$base"..."$head" | grep -Eq \
              '^(infra/supabase/migrations/|packages/persistence-postgres/|scripts/db(\.mts|-migrations\.mts|-seed\.mts)$|compose\.db\.yml|tests/integration/)'; then
              run_pg15=true
            fi
          fi

          if [ "$run_pg15" = "true" ]; then
            matrix='[{"pg_major":"17","image":"pgvector/pgvector:0.8.5-pg17-bookworm"},{"pg_major":"15","image":"pgvector/pgvector:0.8.5-pg15-bookworm"}]'
          else
            matrix='[{"pg_major":"17","image":"pgvector/pgvector:0.8.5-pg17-bookworm"}]'
          fi
          {
            echo "matrix<<EOF"
            echo "$matrix"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "PG15 compatibility: $run_pg15"

  integration-postgres:
    name: Postgres ${{ matrix.pg_major }} integration
    runs-on: ubuntu-latest
    needs: postgres-matrix
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.postgres-matrix.outputs.matrix) }}
    env:
      JPX_DB_IMAGE: ${{ matrix.image }}
      JPX_DB_INSTANCE: ci-pg${{ matrix.pg_major }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same one-command lifecycle as local agents: Compose up → jpx_test_* → migrate →
      # JPX_REQUIRE_DATABASE_TESTS=true → test:integration → drop DB. No silent skips.
      - name: Strict PostgreSQL integration (pnpm db:test)
        run: pnpm db:test

      - name: Collect lifecycle diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p artifacts/db-diagnostics
          {
            echo "pg_major=${{ matrix.pg_major }}"
            echo "image=${{ matrix.image }}"
            echo "JPX_DB_INSTANCE=${JPX_DB_INSTANCE}"
            echo "--- pnpm db:doctor ---"
            pnpm db:doctor || true
          } > artifacts/db-diagnostics/doctor.txt 2>&1

          # Inline hash mirrors resolveProjectName() in scripts/db.mts (P2-16 will dedupe).
          PROJECT="jpx-pgdev-$(node -e "const {createHash}=require('crypto');const p=require('path').resolve('.').replace(/\\\\/g,'/').toLowerCase();process.stdout.write(createHash('sha256').update(p).digest('hex').slice(0,12)+'-'+process.env.JPX_DB_INSTANCE)")"
          {
            echo "compose_project=$PROJECT"
            echo "--- docker compose ps ---"
            docker compose -p "$PROJECT" -f compose.db.yml ps || true
            echo "--- docker compose logs (tail 200) ---"
            docker compose -p "$PROJECT" -f compose.db.yml logs --no-color --tail 200 db || true
          } > artifacts/db-diagnostics/compose.txt 2>&1

          # NOTE: jpx_test_* is already dropped by db:test's finally. This block probes
          # the tool-managed jpx_dev DB only. Real failure diagnostics are in the
          # db:test step log (status/verify emitted before drop).
          # pnpm 10.29.2 writes its run banner to stdout — always use --silent for capture.
          if URL=$(corepack pnpm --silent db:url 2>/dev/null); then
            {
              echo "NOTE: inspects tool-managed jpx_dev, NOT the dropped jpx_test_* DB"
              corepack pnpm exec tsx scripts/db-migrations.mts status --database-url "$URL" || true
            } > artifacts/db-diagnostics/migrations-status.txt 2>&1
            {
              echo "NOTE: inspects tool-managed jpx_dev, NOT the dropped jpx_test_* DB"
              corepack pnpm exec tsx scripts/db-migrations.mts verify --database-url "$URL" || true
            } > artifacts/db-diagnostics/capabilities.txt 2>&1
            sed -i -E 's#postgres(ql)?://[^[:space:]]+#<redacted-url>#g' \
              artifacts/db-diagnostics/*.txt || true
          else
            echo "db:url unavailable — Compose may not have started" \
              > artifacts/db-diagnostics/migrations-status.txt
          fi

      - name: Upload database diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: db-diagnostics-pg${{ matrix.pg_major }}
          path: artifacts/db-diagnostics/
          retention-days: 14

      - name: Tear down Compose project
        if: always()
        run: pnpm db:down

  bicep:
    name: Bicep Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # az is preinstalled on ubuntu runners. Compiling here means a template that dies at the
      # ARM step (like the former invalid assert()) can never merge again.
      - name: Compile Bicep template
        run: az bicep build --file infra/azure/main.bicep --stdout > /dev/null

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    # pw:webserver logs make the documented intermittent webserver hang diagnosable from the run log.
    env:
      DEBUG: pw:webserver
    # Opt-in on PRs (apply the `run-e2e` label), automatic on main pushes (final pre-deploy gate),
    # and manually triggerable via the Actions UI. Avoids burning ~5 min per push on routine PRs.
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-e2e')) ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm test:e2e:install

      # E2E servers expect demo/proxy env inlined at build time (playwright.config.ts).
      - name: Build for E2E
        run: pnpm build:e2e

      # Visual specs compare against the committed *-linux.png baselines, generated in the
      # pinned Playwright Docker image (workflow: scripts/visual-baselines.md). If they all
      # fail with "snapshot doesn't exist", the linux baselines were not regenerated.
      - name: Run E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Closes the "failed silently for weeks" hole: any red job files/updates a tracking issue.
  notify-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [check, build, bicep, e2e, integration-postgres]
    if: failure()
    timeout-minutes: 15
    permissions:
      issues: write
    steps:
      - name: Create or update failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TITLE="CI/deploy failure on ${{ github.workflow }}"
          BODY="Workflow **${{ github.workflow }}** failed on \`${{ github.ref_name }}\` at ${{ github.sha }}.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
